[package]
name = "predictable-viz"
description = "GraphDoc, the DataSource contract and the local viz server (05-viz.md §1.1, §1.2, §2.1)."
version.workspace = true
edition.workspace = true
# arrow 55 needs a newer floor than the workspace's 1.78.
rust-version = "1.82"
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "predictable_viz"
path = "src/lib.rs"

[dependencies]
predictable-check = { workspace = true }
predictable-ir = { workspace = true }
predictable-plan = { workspace = true }
predictable-syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
arrow-array = "55"
arrow-schema = "55"
arrow-ipc = "55"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
getrandom = "0.2"

[dev-dependencies]
predictable-plan = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
arrow-array = "55"
