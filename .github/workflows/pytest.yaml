name: pytest

# The four Python suites must run as four separate pytest invocations: the v0
# package at the repo root shadows the v2 `packages/predictable` package, so a
# single root collection cannot import both (RELEASE_NOTES_v2.md, gap 2).

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip maturin pytest pyarrow
          pip install -e .
          pip install -e packages/predictable

      - name: Build and install the engine wheel
        run: |
          maturin build --release -m crates/predictable-py/Cargo.toml --out dist
          pip install --force-reinstall dist/*.whl

      - name: Build the CLI
        run: |
          cargo build -p predictable-cli
          cargo build --release -p predictable-cli

      - name: v0 root suite
        run: pytest tests -q
      - name: v2 package suite
        run: pytest packages/predictable/tests -q
      - name: bindings suite
        run: pytest crates/predictable-py/tests -q
      - name: reference models suite
        run: pytest models/tests -q
