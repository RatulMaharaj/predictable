[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predictable-v2"
version = "0.1.0"
description = "The predictable v2 authoring DSL: traces Python component bodies into IR expression trees."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ratul Maharaj", email = "ratulmaharaj@gmail.com" }]
dependencies = []

[project.scripts]
predictable-build = "predictable.cli:build_entrypoint"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/predictable"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
