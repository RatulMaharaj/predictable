extra:
  social:
    - icon: fontawesome/brands/mastodon
      link: https://fosstodon.org/@RatulMaharaj
    - icon: fontawesome/brands/github
      link: https://github.com/RatulMaharaj
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ratulmaharaj

theme:
  language: en
  name: material
  palette:
    scheme: slate
    primary: black
    accent: indigo
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - content.code.annotate
    - toc.integrate
    - toc.follow
    - navigation.path
    - navigation.top

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 2
      title: On this page
      permalink: "#"
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # `mermaid` fences are drawn as diagrams rather than printed as code. The design specs
  # (docs/design/) and the verification walkthrough both carry them.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
